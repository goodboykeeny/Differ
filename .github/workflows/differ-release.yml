name: Differ Release

# Builds the Differ installers for macOS (Apple silicon and Intel) and Windows x64, and publishes
# them as a GitHub release.
#
# - A `v<version>` tag (the version in the VERSION file) builds and publishes the release.
# - A push to a `release/**` branch builds and verifies the same packages without publishing; they
#   stay on the run as artifacts.
#
# The packages are not signed with a Developer ID or a Windows certificate and carry no update
# feed: the app is ad-hoc signed on macOS and does not check for updates.

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: differ-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ matrix.target }}
          source-sha: ${{ github.sha }}
      - name: Compile
        run: cargo build --release --locked --target "$TARGET" -p winc -p winc-pty
      # The remote server runs on Linux hosts whatever system this package is for.
      - name: Compile remote server
        run: cargo xtask server
      - name: Bundle app
        run: cargo xtask app --target "$TARGET" --no-build
      - name: Package dmg
        run: |
          version="$(node release/common/version.mjs)"
          dmg="$RUNNER_TEMP/release-assets/Differ-$version-macos-$ARCH.dmg"
          cargo xtask dmg --app "target/$TARGET/release/bundle/Differ.app" --output "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Verify dmg
        run: |
          set -euo pipefail
          version="$(node release/common/version.mjs)"
          mount="$RUNNER_TEMP/differ-dmg"
          mkdir -p "$mount"
          hdiutil attach -quiet -readonly -nobrowse -noautoopen -mountpoint "$mount" "$DMG"
          trap 'hdiutil detach -quiet "$mount"' EXIT
          app="$mount/Differ.app"
          [[ -L "$mount/Applications" ]]
          codesign --verify --deep --strict "$app"
          for program in differ winc-pty; do
            archs="$(lipo -archs "$app/Contents/MacOS/$program")"
            [[ "$archs" == "${TARGET%%-*}" || ( "$archs" == arm64 && "$TARGET" == aarch64-* ) ]]
          done
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$version" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == io.github.goodboykeeny.differ ]]
          # Intel programs run under Rosetta on this runner when it is installed; skip otherwise.
          if [[ "$ARCH" == arm64 ]] || arch -x86_64 /usr/bin/true 2>/dev/null; then
            "$app/Contents/MacOS/differ" --version | grep -F "$version"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ env.TARGET }}
          source-sha: ${{ github.sha }}
      - name: Compile
        run: |
          cargo build --release --locked --target "$TARGET" -p winc -p winc-pty
          cargo xtask icons "target/$TARGET/release/bundle/icons"
      - name: Compile remote server
        run: cargo xtask server
      # The file watcher runs inside WSL distributions. It is static and has no C code, so the
      # linker bundled with Rust is enough to build it on Windows.
      - name: Compile WSL file watcher
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p winc-watch
      - name: Fetch console host
        shell: pwsh
        run: ./release/windows/conpty.ps1 -Destination "target/$env:TARGET/release"
      - name: Install native packaging tools
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --allow-downgrade --yes --no-progress
          choco install wixtoolset --version=3.14.1 --allow-downgrade --yes --no-progress
      - name: Bundle NSIS and MSI installers
        run: pwsh -NoProfile -File release/windows/package.ps1 -Phase installers -Target "$TARGET"
      - name: Package portable
        shell: pwsh
        run: ./release/windows/package.ps1 -Phase portable -Target $env:TARGET
      - name: Verify installers
        shell: pwsh
        run: ./release/windows/verify.ps1 -Target $env:TARGET
      - name: Stage release assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          bundle="target/$TARGET/release/bundle"
          cp "$bundle"/nsis/Differ-*-setup.exe "$bundle"/msi/Differ-*.msi "$bundle"/portable/Differ-*-portable.zip \
            "$RUNNER_TEMP/release-assets/"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows-x64
          path: ${{ runner.temp }}/release-assets
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node release/common/version.mjs)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match the VERSION file ($version)"
            exit 1
          fi
          cd release-assets
          expected=(
            "Differ-$version-macos-arm64.dmg"
            "Differ-$version-macos-x64.dmg"
            "Differ-$version-windows-x64-setup.exe"
            "Differ-$version-windows-x64.msi"
            "Differ-$version-windows-x64-portable.zip"
          )
          for name in "${expected[@]}"; do [[ -s "$name" ]] || { echo "::error::missing $name"; exit 1; }; done
          sha256sum "${expected[@]}" > SHA256SUMS
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Downloads

          | System | File |
          | --- | --- |
          | macOS, Apple silicon | \`Differ-$version-macos-arm64.dmg\` |
          | macOS, Intel | \`Differ-$version-macos-x64.dmg\` |
          | Windows x64, installer | \`Differ-$version-windows-x64-setup.exe\` |
          | Windows x64, MSI (all users) | \`Differ-$version-windows-x64.msi\` |
          | Windows x64, portable | \`Differ-$version-windows-x64-portable.zip\` |

          The packages are not signed with an Apple Developer ID or a Windows certificate.

          - **macOS**: drag Differ to Applications, then run \`xattr -dr com.apple.quarantine /Applications/Differ.app\` once, or allow it under System Settings > Privacy & Security > Open Anyway.
          - **Windows**: when SmartScreen appears, choose More info > Run anyway.
          NOTES
          # A version with a suffix, such as 0.2.0-beta.1, is a pre-release.
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${expected[@]}" SHA256SUMS \
            --verify-tag --title "Differ $version" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
