<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <title>Differ App Logo</title>

  <!-- 四周透明 -->
  <rect x="52" y="52" width="920" height="918" rx="222" fill="#1E1F22"/>

  <!-- 丝带轮廓与折面 -->
  <!-- 字母 D 拆成左右两半：左边的竖是改动之前，右边的弧是改动之后 -->
  <rect x="310" y="272" width="96" height="480" rx="48" fill="#7B7F87"/>
  <path
    d="M474 272 A240 240 0 0 1 474 752 A48 48 0 0 1 474 656 A144 144 0 0 0 474 368 A48 48 0 0 1 474 272 Z"
    fill="#F4F2EC"
  />

  <!-- 中间的圆点是改动的地方 -->
  <circle cx="498" cy="512" r="46" fill="#4C8DF6"/>
</svg>
