<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <title>Differ App Logo</title>

  <!-- 四周透明 -->
  <rect x="52" y="52" width="920" height="918" rx="222" fill="#18202B"/>

  <!-- 丝带轮廓与折面 -->
  <rect x="196" y="250" width="290" height="524" rx="44" fill="#2A3442"/>
  <rect x="538" y="250" width="290" height="524" rx="44" fill="#F2F4F6"/>

  <!-- 左栏：原有的行，其中一行被删去 -->
  <rect x="244" y="330" width="194" height="40" rx="20" fill="#DDE2E8"/>
  <rect x="244" y="418" width="150" height="40" rx="20" fill="#E5604F"/>
  <rect x="244" y="506" width="194" height="40" rx="20" fill="#DDE2E8"/>
  <rect x="244" y="594" width="110" height="40" rx="20" fill="#DDE2E8"/>

  <!-- 右栏：改动后的行 -->
  <rect x="586" y="330" width="194" height="40" rx="20" fill="#18202B"/>
  <rect x="586" y="594" width="110" height="40" rx="20" fill="#18202B"/>

  <!-- 黄色的是改动的行 -->
  <circle cx="606" cy="438" r="20" fill="#F2B705"/>
  <rect x="586" y="418" width="194" height="40" rx="20" fill="#F2B705"/>
  <rect x="586" y="506" width="150" height="40" rx="20" fill="#F2B705"/>
</svg>
