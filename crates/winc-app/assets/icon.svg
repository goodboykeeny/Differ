<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <title>Differ App Logo</title>

  <!-- 四周透明 -->
  <rect x="52" y="52" width="920" height="918" rx="222" fill="#1E1F22"/>

  <!-- 丝带轮廓与折面 -->
  <!-- 字母 D 拆成左右两半：左边的竖是改动之前，右边的弧是改动之后 -->
  <rect x="310" y="272" width="96" height="480" rx="48" fill="#7B7F87"/>
  <!-- 弧用三次贝塞尔曲线写出，不用 A：恰好半圆的 A 在不同平台上分成的段数不同，栅格化的结果会差几个值 -->
  <path
    d="M474 272
       C606.55 272 714 379.45 714 512 C714 644.55 606.55 752 474 752
       C447.49 752 426 730.51 426 704 C426 677.49 447.49 656 474 656
       C553.53 656 618 591.53 618 512 C618 432.47 553.53 368 474 368
       C447.49 368 426 346.51 426 320 C426 293.49 447.49 272 474 272 Z"
    fill="#F4F2EC"
  />

  <!-- 中间的圆点是改动的地方 -->
  <circle cx="498" cy="512" r="46" fill="#4C8DF6"/>
</svg>
